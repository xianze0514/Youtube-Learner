<!doctype html>
<html lang="zh-CN" data-elt-preview="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>独立学习页 · 界面预览</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/practice.css" />
    <link rel="stylesheet" href="styles/dictionary.css" />
    <link rel="stylesheet" href="styles/controls.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="stylesheet" href="styles/learning.css">
    <link rel="stylesheet" href="styles/review.css">
  </head>
  <body>
    <video
      muted
      preload="metadata"
      poster="https://i.ytimg.com/vi/RcGyVTAoXEU/maxresdefault.jpg"
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
    ></video>
    <script>
      const previewDictionaryEntry = {
        word: "remarkable",
        translation: "非凡的；引人注目的",
        phonetic: "英 [ rɪˈmɑːkəbl ] · 美 [ rɪˈmɑːrkəbl ]",
        phonetics: [
          { label: "英", text: "[ rɪˈmɑːkəbl ]", audioUrl: "" },
          { label: "美", text: "[ rɪˈmɑːrkəbl ]", audioUrl: "" },
        ],
        meanings: [
          { partOfSpeech: "adj.", definition: "非凡的，奇异的；显著的，引人注目的" },
          { partOfSpeech: "adj.", definition: "值得注意或令人印象深刻的" },
        ],
        examples: [
          { en: "She has made remarkable progress this year.", zh: "她今年取得了显著的进步。" },
          { en: "The view from the mountain was remarkable.", zh: "山顶的景色令人印象深刻。" },
        ],
      };
      window.chrome ||= {};
      window.chrome.runtime ||= {};
      window.chrome.storage ||= { local: {} };
      window.chrome.runtime.onMessage ||= { addListener() {} };
      const previewTranslations = {
        0: "每天迈出一小步，就会带来显著的进步。",
        1: "仔细听，然后输入你听到的句子。",
        2: "练习会让陌生的声音逐渐变得自然。",
        3: "每正确输入一个单词，信心都会随之增长。",
      };
      window.chrome.runtime.sendMessage ||= async (message) => {
        if (message.type === "ELT_LINKING_HINTS") {
          // Presentation fixtures only; production uses Quark IPA + C→V rules.
          const pairs = ["steps every", "makes unfamiliar", "grows one", "word at", "at a"];
          const links = pairs.flatMap(pair => {
            const start = message.targetSentence.toLowerCase().indexOf(pair);
            if (start < 0) return [];
            const [a, b] = pair.split(" ");
            return [{ leftStart: start, leftEnd: start + a.length,
              rightStart: start + a.length + 1, rightEnd: start + pair.length }];
          });
          return { links };
        }
        if (message.type === "ELT_GET_SETTINGS") {
          return {
            settings: {
              translationEnabled: true,
              completionMode: "manual",
              apiKeyConfigured: true,
              model: "deepseek-v4-flash",
            },
          };
        }
        if (message.type === "ELT_TRANSLATE_SEGMENTS") {
          return {
            translations: message.segments.map((segment) => ({
              id: segment.id,
              translatedText: previewTranslations[segment.id],
            })),
          };
        }
        if (message.type === "ELT_ANALYZE_SENTENCE") {
          // Authored teaching fixtures, validated by the same code as real responses.
          const [{ validateAnalysis }, fixtures] = await Promise.all([
            import("./background/analysis.js"),
            fetch("./tests/fixtures/syntax-analysis.json").then(response => response.json()),
          ]);
          const fixture = Object.values(fixtures).find(item => item.structure.orig === message.targetSentence);
          if (!fixture) return { error: "预览仅提供示例句详解，真实学习页会请求当前句的解析。" };
          return { analysis: validateAnalysis(fixture, message.targetSentence) };
        }

        if (message.type === "ELT_OPEN_SETTINGS") return { ok: true };
        return {
          entry: { ...previewDictionaryEntry, word: message.word },
        };
      };
      document.documentElement.dataset.youtubeSpaceEvents = "0";
      document.addEventListener("keydown", (event) => {
        if (event.code !== "Space") return;
        document.documentElement.dataset.youtubeSpaceEvents = String(
          Number(document.documentElement.dataset.youtubeSpaceEvents) + 1,
        );
        const previewVideo = document.querySelector("video");
        if (previewVideo.paused) {
          void previewVideo.play();
        } else {
          previewVideo.pause();
        }
      });
    </script>
    <script src="content/captions.js"></script>
    <script src="content/transcript.js"></script>
    <script src="content/template.js"></script>
    <script src="content/dictionary.js"></script>
    <script src="content/review.js"></script>
    <script src="content/renderer.js"></script>
    <script src="content/audio.js"></script>
    <script src="content/main.js"></script>
  </body>
</html>
